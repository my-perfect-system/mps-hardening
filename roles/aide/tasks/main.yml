---
- name: "HARDEN_AIDE - Install AIDE package"
  ansible.builtin.apt:
    name: "{{ aide_packages }}"
    state: present
    update_cache: true
  become: true

- name: "HARDEN_AIDE - Ensure /etc/aide/aide.conf.d exists"
  ansible.builtin.file:
    path: "{{ aide_confd_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: "HARDEN_AIDE - Render AIDE exclusions drop-in"
  ansible.builtin.template:
    src: etc/aide/aide.conf.d/70_exclusions.conf.j2
    dest: "{{ aide_exclusions_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
