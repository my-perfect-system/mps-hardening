---
- name: Install aide packages
  ansible.builtin.package:
    name: "{{ aide_packages }}"
    state: present
    update_cache: true
  become: true

- name: Ensure aide conf.d directory exists
  ansible.builtin.file:
    path: "{{ aide_confd_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Render AIDE exclusions configuration
  ansible.builtin.template:
    src: etc/aide/aide.conf.d/70_exclusions.conf.j2
    dest: "{{ aide_exclusions_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
