---
- name: "HARDEN_AUDITD - Install auditd package"
  ansible.builtin.apt:
    name: "{{ auditd_packages }}"
    state: present
    update_cache: true
  become: true

- name: "HARDEN_AUDITD - Ensure /etc/audit/rules.d exists"
  ansible.builtin.file:
    path: "{{ auditd_rules_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: "HARDEN_AUDITD - Ensure /var/run/audit exists"
  ansible.builtin.file:
    path: "{{ auditd_run_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: "HARDEN_AUDITD - Render /etc/audit/auditd.conf"
  ansible.builtin.template:
    src: etc/audit/auditd.conf.j2
    dest: "{{ auditd_config_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: "HARDEN_AUDITD - Ensure auditd systemd drop-in directory exists"
  ansible.builtin.file:
    path: "{{ auditd_override_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: "HARDEN_AUDITD - Render auditd systemd drop-in"
  ansible.builtin.template:
    src: usr/lib/systemd/system/auditd.service.d/override.conf.j2
    dest: "{{ auditd_override_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
