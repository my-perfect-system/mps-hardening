---
- name: Install auditd packages
  ansible.builtin.apt:
    name: "{{ auditd_packages }}"
    state: present
    update_cache: true
  become: true

- name: Ensure auditd rules directory exists
  ansible.builtin.file:
    path: "{{ auditd_rules_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Ensure auditd run directory exists
  ansible.builtin.file:
    path: "{{ auditd_run_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Render auditd configuration
  ansible.builtin.template:
    src: etc/audit/auditd.conf.j2
    dest: "{{ auditd_config_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Ensure auditd service override directory exists
  ansible.builtin.file:
    path: "{{ auditd_override_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Render auditd service override
  ansible.builtin.template:
    src: usr/lib/systemd/system/auditd.service.d/override.conf.j2
    dest: "{{ auditd_override_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
