---
auditd_packages:
  - auditd
auditd_log_file: /var/log/audit/audit.log
auditd_log_format: RAW
auditd_flush: INCREMENTAL
auditd_freq: 50
auditd_max_log_file: 8
auditd_max_log_file_action: ROTATE
auditd_space_left: 75
auditd_space_left_action: SYSLOG
auditd_admin_space_left: 50
auditd_admin_space_left_action: SUSPEND
auditd_disk_full_action: SUSPEND
auditd_disk_error_action: SUSPEND
auditd_run_dir: /var/run/audit
auditd_rules_dir: /etc/audit/rules.d
auditd_config_path: /etc/audit/auditd.conf
auditd_override_dir: /usr/lib/systemd/system/auditd.service.d
auditd_override_path: "{{ auditd_override_dir }}/override.conf"
auditd_localstatedir: /var
