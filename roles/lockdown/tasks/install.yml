---
- name: LOCKDOWN - Install build tools
  ansible.builtin.package:
    name:
      - cracklib-runtime
    state: present

- name: "LOCKDOWN - Ensure repo directory exists"
  ansible.builtin.file:
    path: "{{ lockdown_repos_dir }}"
    state: directory
    owner: "{{ lockdown_user }}"
    group: "{{ lockdown_user }}"
    mode: "0755"
  become: true
  become_user: "{{ lockdown_user }}"

- name: "LOCKDOWN - Clone CIS lockdown role"
  ansible.builtin.git:
    repo: "{{ lockdown_cis_repo }}"
    dest: "{{ lockdown_repos_dir }}/DEBIAN13-CIS"
    version: "{{ lockdown_cis_version }}"
    force: true
  become: true
  become_user: "{{ lockdown_user }}"

- name: "LOCKDOWN - Create inventory directory"
  ansible.builtin.file:
    path: "{{ lockdown_repos_dir }}/DEBIAN13-CIS/inventory"
    state: directory
    owner: "{{ lockdown_user }}"
    group: "{{ lockdown_user }}"
    mode: "0755"
  become: true
  become_user: "{{ lockdown_user }}"

- name: "LOCKDOWN - Render inventory file"
  ansible.builtin.template:
    src: hosts.j2
    dest: "{{ lockdown_repos_dir }}/DEBIAN13-CIS/inventory/hosts"
    owner: "{{ lockdown_user }}"
    group: "{{ lockdown_user }}"
    mode: "0644"
  become: true
  become_user: "{{ lockdown_user }}"

- name: "LOCKDOWN - Install ansible package"
  ansible.builtin.apt:
    name:
      - ansible
    state: present

- name: "LOCKDOWN - Ensure .ssh directory exists"
  ansible.builtin.file:
    path: "{{ lockdown_user_home }}/.ssh"
    state: directory
    owner: "{{ lockdown_user }}"
    group: "{{ lockdown_user }}"
    mode: "0700"
  become: true

- name: "LOCKDOWN - Generate SSH keypair"
  community.crypto.openssh_keypair:
    path: "{{ lockdown_user_home }}/.ssh/id_rsa"
    type: rsa
    size: 4096
    owner: "{{ lockdown_user }}"
    group: "{{ lockdown_user }}"
    mode: "0600"
    force: true
  become: true

- name: "LOCKDOWN - Read public key"
  ansible.builtin.slurp:
    src: "{{ lockdown_user_home }}/.ssh/id_rsa.pub"
  register: lockdown_pubkey

- name: "LOCKDOWN - Authorize own key"
  ansible.posix.authorized_key:
    user: "{{ lockdown_user }}"
    key: "{{ lockdown_pubkey['content'] | b64decode }}"
  become: true

- name: "LOCKDOWN - Add deploy user to CIS nopasswd list"
  ansible.builtin.lineinfile:
    path: "{{ lockdown_repos_dir }}/DEBIAN13-CIS/defaults/main.yml"
    insertafter: '^deb13cis_sudoers_exclude_nopasswd_list:'
    line: '  - {{ lockdown_user }}'
  become: true
  become_user: "{{ lockdown_user }}"

- name: "LOCKDOWN - Add admin group to CIS nopasswd list"
  ansible.builtin.lineinfile:
    path: "{{ lockdown_repos_dir }}/DEBIAN13-CIS/defaults/main.yml"
    insertafter: '^deb13cis_sudoers_exclude_nopasswd_list:'
    line: '  - "%admin"'
  become: true
  become_user: "{{ lockdown_user }}"

- name: "LOCKDOWN - Extend AIDE async timeout"
  ansible.builtin.lineinfile:
    path: "{{ lockdown_repos_dir }}/DEBIAN13-CIS/defaults/main.yml"
    regexp: '^deb13cis_aide_init_async:'
    line: 'deb13cis_aide_init_async: 3600'
  become: true
  become_user: "{{ lockdown_user }}"

- name: "LOCKDOWN - Keep X server for desktop systems"
  ansible.builtin.lineinfile:
    path: "{{ lockdown_repos_dir }}/DEBIAN13-CIS/defaults/main.yml"
    regexp: '^deb13cis_xwindow_server:'
    line: 'deb13cis_xwindow_server: true'
  become: true
  become_user: "{{ lockdown_user }}"

- name: "LOCKDOWN - Set CIS firewall package"
  ansible.builtin.lineinfile:
    path: "{{ lockdown_repos_dir }}/DEBIAN13-CIS/defaults/main.yml"
    regexp: '^deb13cis_firewall_package:'
    line: 'deb13cis_firewall_package: {{ lockdown_firewall_package }}'
  become: true
  become_user: "{{ lockdown_user }}"

- name: "LOCKDOWN - Set sugroup to 'sudo'"
  ansible.builtin.lineinfile:
    path: "{{ lockdown_repos_dir }}/DEBIAN13-CIS/defaults/main.yml"
    regexp: '^deb13cis_sugroup:'
    line: 'deb13cis_sugroup: sudo'
  become: true
  become_user: "{{ lockdown_user }}"

- name: "LOCKDOWN - Run CIS site.yml playbook (async, survives sshd restart)"
  ansible.builtin.shell: |
    /usr/bin/ansible-playbook -i inventory/hosts site.yml -v
  args:
    chdir: "{{ lockdown_repos_dir }}/DEBIAN13-CIS"
  environment:
    ANSIBLE_HOST_KEY_CHECKING: "False"
    ANSIBLE_SSH_CONTROL_PATH: "none"
    ANSIBLE_SSH_ARGS: >
      -o PreferredAuthentications=publickey
      -o PubkeyAuthentication=yes
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
  become: true
  become_user: "{{ lockdown_user }}"
  when: lockdown_enable_execute | bool
