---
- name: Install cracklib-runtime package
  ansible.builtin.package:
    name:
      - cracklib-runtime
    state: present

- name: Ensure lockdown repos directory exists
  ansible.builtin.file:
    path: "{{ lockdown_repos_dir }}"
    state: directory
    owner: "{{ lockdown_user }}"
    group: "{{ lockdown_user }}"
    mode: "0755"
  become: true
  become_user: "{{ lockdown_user }}"

- name: Clone DEBIAN13-CIS repository
  ansible.builtin.git:
    repo: "{{ lockdown_cis_repo }}"
    dest: "{{ lockdown_repos_dir }}/DEBIAN13-CIS"
    version: "{{ lockdown_cis_version }}"
    force: true
  become: true
  become_user: "{{ lockdown_user }}"

- name: Ensure CIS inventory directory exists
  ansible.builtin.file:
    path: "{{ lockdown_repos_dir }}/DEBIAN13-CIS/inventory"
    state: directory
    owner: "{{ lockdown_user }}"
    group: "{{ lockdown_user }}"
    mode: "0755"
  become: true
  become_user: "{{ lockdown_user }}"

- name: Render CIS inventory hosts file
  ansible.builtin.template:
    src: hosts.j2
    dest: "{{ lockdown_repos_dir }}/DEBIAN13-CIS/inventory/hosts"
    owner: "{{ lockdown_user }}"
    group: "{{ lockdown_user }}"
    mode: "0644"
  become: true
  become_user: "{{ lockdown_user }}"

- name: Install ansible package
  ansible.builtin.package:
    name:
      - ansible
    state: present

- name: Ensure lockdown user .ssh directory exists
  ansible.builtin.file:
    path: "{{ lockdown_user_home }}/.ssh"
    state: directory
    owner: "{{ lockdown_user }}"
    group: "{{ lockdown_user }}"
    mode: "0700"
  become: true

- name: Generate lockdown user SSH keypair
  community.crypto.openssh_keypair:
    path: "{{ lockdown_user_home }}/.ssh/id_rsa"
    type: rsa
    size: 4096
    owner: "{{ lockdown_user }}"
    group: "{{ lockdown_user }}"
    mode: "0600"
    force: true
  become: true

- name: Read lockdown user public SSH key
  ansible.builtin.slurp:
    src: "{{ lockdown_user_home }}/.ssh/id_rsa.pub"
  register: lockdown_pubkey

- name: Authorize lockdown user SSH key for itself
  ansible.posix.authorized_key:
    user: "{{ lockdown_user }}"
    key: "{{ lockdown_pubkey['content'] | b64decode }}"
  become: true

- name: Add lockdown user to CIS sudoers nopasswd list
  ansible.builtin.lineinfile:
    path: "{{ lockdown_repos_dir }}/DEBIAN13-CIS/defaults/main.yml"
    insertafter: '^deb13cis_sudoers_exclude_nopasswd_list:'
    line: '  - {{ lockdown_user }}'
  become: true
  become_user: "{{ lockdown_user }}"

- name: Add admin group to CIS sudoers nopasswd list
  ansible.builtin.lineinfile:
    path: "{{ lockdown_repos_dir }}/DEBIAN13-CIS/defaults/main.yml"
    insertafter: '^deb13cis_sudoers_exclude_nopasswd_list:'
    line: '  - "%admin"'
  become: true
  become_user: "{{ lockdown_user }}"

- name: Override CIS AIDE init async threshold
  ansible.builtin.lineinfile:
    path: "{{ lockdown_repos_dir }}/DEBIAN13-CIS/defaults/main.yml"
    regexp: '^deb13cis_aide_init_async:'
    line: 'deb13cis_aide_init_async: 3600'
  become: true
  become_user: "{{ lockdown_user }}"

- name: Enable X window server in CIS defaults
  ansible.builtin.lineinfile:
    path: "{{ lockdown_repos_dir }}/DEBIAN13-CIS/defaults/main.yml"
    regexp: '^deb13cis_xwindow_server:'
    line: 'deb13cis_xwindow_server: true'
  become: true
  become_user: "{{ lockdown_user }}"

- name: Override CIS firewall package
  ansible.builtin.lineinfile:
    path: "{{ lockdown_repos_dir }}/DEBIAN13-CIS/defaults/main.yml"
    regexp: '^deb13cis_firewall_package:'
    line: 'deb13cis_firewall_package: {{ lockdown_firewall_package }}'
  become: true
  become_user: "{{ lockdown_user }}"

- name: Override CIS sugroup to sudo
  ansible.builtin.lineinfile:
    path: "{{ lockdown_repos_dir }}/DEBIAN13-CIS/defaults/main.yml"
    regexp: '^deb13cis_sugroup:'
    line: 'deb13cis_sugroup: sudo'
  become: true
  become_user: "{{ lockdown_user }}"

- name: Execute CIS lockdown playbook when enabled
  ansible.builtin.shell: |
    /usr/bin/ansible-playbook -i inventory/hosts site.yml -v
  args:
    chdir: "{{ lockdown_repos_dir }}/DEBIAN13-CIS"
  environment:
    ANSIBLE_HOST_KEY_CHECKING: "False"
    ANSIBLE_SSH_CONTROL_PATH: "none"
    ANSIBLE_SSH_ARGS: >
      -o PreferredAuthentications=publickey
      -o PubkeyAuthentication=yes
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
  become: true
  become_user: "{{ lockdown_user }}"
  when: lockdown_enable_execute | bool
